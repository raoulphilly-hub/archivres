  heading.textContent = "TRACKLIST";
  container.append(heading);

  list.className = "tracklist";
  mix.tracks.forEach(track => {

    item.textContent = track;
    list.append(item);
  });

  footer.textContent = "Selected grooves for bleeding ears.";

} else {
